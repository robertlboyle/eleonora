[workspace]
resolver = "3"
members = ["crates/eleonora-core", "crates/eleonora-testkit", "crates/eleonora-cli", "crates/eleonora-app", "crates/eleonora-web", "crates/eleonora-release", "crates/eleonora-voice"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Planet Networks"]
publish = false

[profile.release]
debug = "line-tables-only"

# Tests run optimized: they push tens of thousands of messages through zstd, SQLite and Tantivy.
[profile.test]
opt-level = 2

# The natural voices' program is downloaded on request: as small as it can be (no debugging tables)
[profile.release.package.eleonora-voice]
debug = false
strip = true

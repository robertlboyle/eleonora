<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Eleonora's tray icon when new mail has come in: the falcon icon with an orange dot. -->
  <defs>
    <linearGradient id="sky" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18a4ff"/>
      <stop offset="0.45" stop-color="#0a5fd8"/>
      <stop offset="1" stop-color="#0a2f8a"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c9ddff"/>
      <stop offset="0.8" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ab0ff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3ab0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ab0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#c9daf2"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04174a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- the sky -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#sky)"/>

  <g fill="url(#feather)">
    <!-- upper wing, a long blade swept back -->
    <path d="M127 51 C 170 108, 226 150, 284 172 C 302 180, 314 192, 322 206 L 248 186 C 200 162, 158 112, 127 51 Z"/>
    <!-- lower wing -->
    <path d="M62 104 C 118 140, 186 166, 252 184 L 334 214 L 290 240 C 240 222, 196 214, 160 208 C 118 190, 84 150, 62 104 Z"/>
    <!-- the body's long sweep down to the tail -->
    <path d="M88 362 C 124 310, 196 270, 284 238 C 312 228, 328 222, 340 218 L 344 274
             C 300 276, 246 284, 198 300 C 150 316, 112 338, 88 362 Z"/>
    <!-- head and hooked beak -->
    <path d="M318 200 C 344 186, 372 184, 394 190 C 418 197, 435 213, 440 231 C 442 240, 439 246, 434 249
             C 434 241, 430 235, 422 234 C 402 233, 382 240, 366 250 C 354 258, 343 270, 334 283
             L 300 238 Z"/>
    <!-- the crest feather over the brow -->
    <path d="M320 182 C 336 178, 352 180, 364 186 C 350 186, 336 190, 326 196 Z"/>
  </g>
  <!-- the eye -->
  <path d="M401 211 C 409 206, 420 207, 427 213 C 420 217, 409 217, 401 211 Z" fill="#1652c8"/>

  <!-- the letter -->
  <g filter="url(#lift)">
    <rect x="177" y="306" width="200" height="124" rx="20" fill="url(#paper)"/>
  </g>
  <path d="M182 318 L 271 377 C 275 380, 280 380, 284 377 L 373 318" stroke="#1a63dc" stroke-width="7"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- new mail: a bright dot, top right -->
  <circle cx="404" cy="108" r="92" fill="#ffffff"/>
  <circle cx="404" cy="108" r="72" fill="#ff7a1a"/>
</svg>
